## Gitleaks config for Teacher Assistant.
## Extends gitleaks' default ruleset (covers Google API keys, generic
## high-entropy secrets, private keys, etc.) and adds an explicit rule for
## the Gemini/Google "AIza..." key format, since that's the exact secret
## this project had leaked historically.

[extend]
useDefault = true

[[rules]]
id = "google-api-key"
description = "Google / Gemini API key (AIza...)"
regex = '''AIza[0-9A-Za-z_\-]{35}'''
tags = ["key", "google", "gemini"]

[allowlist]
description = "Known-safe placeholders and examples"
regexes = [
  '''AIzaSyD\.\.\.your-actual-key-here\.\.\.''', # SETUP.md placeholder, not a real key
  '''your-actual-api-key-here''',
]
paths = [
  '''\.env\.example$''',
  # Eval-cassette lookup keys (server/evals/README.md): a deterministic
  # per-case cache key the harness generates from caseId/turn, always
  # exactly 32 lowercase hex characters in a field literally named "key".
  # Trips the default generic-api-key rule on shape alone. Not a
  # credential — the harness never records Authorization/API-key headers
  # into cassettes (verified: no such header has ever appeared in any
  # cassette file), so scoping the exemption to this path doesn't weaken
  # scanning of anything that could actually leak a real secret.
  '''^server/evals/cassettes/.*\.json$''',
]
